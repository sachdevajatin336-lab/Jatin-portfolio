<!DOCTYPE html>
<html>
<head>
  <title>My First Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      text-align: center;
      background: #eaf0ff;
      padding: 60px 20px;
    }

    .box {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 10px 30px #bbb;
    }

    .pic {
      font-size: 100px;
    }

    h1 {
      font-size: 40px;
    }

    p {
      font-size: 20px;
      color: #555;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 30px;
      background: #315bea;
      color: white;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="pic">🏔️</div>

    <h1>Hello 👋</h1>

    <p>This is my first live website.</p>

    <button onclick="alert('Website is working! 🎉')">
      Click Me
    </button>
  </div>

</body>
</html>
